# Copy to .streamlit/secrets.toml (git ignores it) and fill in. Never commit real values.

# Google sign-in for the admin page (Streamlit's st.login). Make an OAuth client of type "Web application" in Google
# Cloud and give it this redirect address, with the port the dashboard runs on (48973 in .claude/launch.json;
# Streamlit's own default is 8501). The cookie secret is any long random text, e.g. from: openssl rand -hex 32
[auth]
redirect_uri = "http://localhost:48973/oauth2callback"
cookie_secret = ""
client_id = ""
client_secret = ""
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Who may see the admin page, and the GitHub token it works with. The page writes each decision on the pull request
# and merges or closes it, so the token (fine-grained, this repository only) needs Pull requests: read and write,
# Contents: read and write, and Checks: read.
[admin]
allowed = ["someone@example.com"]
github_token = ""

# Each person's GitHub account, if they have one, so the page knows who raised an item: the person who raised it
# cannot also decide it.
[admin.accounts]
"someone@example.com" = "their-github-account"

# The Space-Track login app.py uses.
[spacetrack]
username = ""
password = ""
