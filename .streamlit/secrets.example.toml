# Copy to .streamlit/secrets.toml (git ignores it) and fill in. Never commit real values.

# Google sign-in for the administration console, admin.py (Streamlit's st.login). Make an OAuth client of type
# "Web application" in Google Cloud and give it this redirect address, with the port the console runs on
# (48973 in .claude/launch.json; Streamlit's own default is 8501). The cookie secret is any long random text,
# for example from: openssl rand -hex 32
#
# One Google OAuth client lists every address the console runs at, as Authorized redirect URIs (both are there now):
#   this computer:  http://localhost:48973/oauth2callback          -> this file
#   shared copy:    https://gnss-master-console.streamlit.app/oauth2callback  -> Streamlit > Settings > Secrets
# Each copy's secrets name only its own address, once. Neither ever needs changing; Google needs a new line only if
# the console starts running somewhere new.
[auth]
redirect_uri = "http://localhost:48973/oauth2callback"
cookie_secret = ""
client_id = ""
client_secret = ""
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Who may use the console, and the GitHub token it works with: a fine-grained token, resource owner
# SumanthVarma798, with access to two repositories only: GNSS-Constellation-Health-Monitoring-System (Pull requests
# read and write, Contents read and write, Checks read, Actions read) and its -archive (Contents read, for the run
# logs). The console writes each decision on the pull request and merges or closes it.
[admin]
allowed = ["someone@example.com"]
github_token = ""

# The Space-Track login app.py uses.
[spacetrack]
username = ""
password = ""
