# Copy to .streamlit/secrets.toml (git ignores it) and fill in. Never commit real values.

# Google sign-in for the admin page (Streamlit's st.login). Make an OAuth client of type "Web application" in Google
# Cloud and give it this redirect address. The cookie secret is any long random text, e.g. from: openssl rand -hex 32
[auth]
redirect_uri = "http://localhost:48973/oauth2callback"
cookie_secret = ""
client_id = ""
client_secret = ""
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Who may see the admin page, and the GitHub token it reads pull requests with (read access to the private mirror's
# pull requests is enough for now).
[admin]
allowed = ["someone@example.com"]
github_token = ""

# The Space-Track login app.py uses.
[spacetrack]
username = ""
password = ""
