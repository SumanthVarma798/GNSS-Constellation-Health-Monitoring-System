<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System design</title>
<style>
__TOKENS__
*, *::before, *::after { box-sizing: border-box; border-radius: 0 !important; }
html, body { margin: 0; background: var(--pane); color: var(--ink); font: 13px/1.45 __FONT__; }
:focus-visible { outline: 2px solid var(--c-info); outline-offset: 2px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--edge); margin-bottom: 12px; }
.facts div { padding: 8px 12px; border-right: 1px solid var(--edge); border-top: 4px solid var(--c-info); min-width: 0; }
.facts b { display: block; font-size: 22px; font-weight: 600; line-height: 1.2; }
.facts span { color: var(--muted); }
.diagram { border: 1px solid var(--edge); padding: 10px; overflow-x: auto; }
#sysmap { display: block; width: 100%; min-width: 760px; height: auto; font: 12px __FONT__; }
#sysmap .cols text { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-anchor: middle; fill: var(--muted); }
#sysmap #edges path { fill: none; stroke: var(--axis); stroke-width: 1.5; marker-end: url(#arr); }
#sysmap #edges path[data-e="src-job"]:not(:first-child) { marker-end: none; }
#sysmap #edges path.planned { stroke-dasharray: 5 4; stroke: var(--c-info); }
#sysmap #edges path.on { stroke: var(--c-info); stroke-width: 3; marker-end: url(#arr-on); }
#sysmap #nodes g { cursor: pointer; }
#sysmap #nodes rect { fill: var(--pane); stroke: var(--c-ok); stroke-width: 2; }
#sysmap #nodes g.planned rect { stroke: var(--c-info); stroke-dasharray: 6 4; }
#sysmap #nodes g.key rect { stroke: var(--c-c); stroke-width: 3; }
#sysmap #nodes text { fill: var(--ink); font-weight: 700; }
#sysmap #nodes text.s { font-weight: 400; fill: var(--muted); font-size: 11px; }
#sysmap #nodes g:hover rect { fill: var(--hover); stroke: var(--select-edge); stroke-width: 3; }
#sysmap #nodes g.lit rect { fill: var(--pane-alt); stroke-width: 4; }
#sysmap #nodes g.sel rect { fill: var(--select); }
#sysmap #nodes g.sel text { fill: var(--select-ink); }
#sysmap #nodes g:focus-visible rect { stroke: var(--c-info); stroke-width: 4; }
#sysmap #nodes g:focus { outline: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 11px; margin-top: 8px; }
.legend b { display: inline-block; width: 14px; height: 10px; margin-right: 5px; vertical-align: -1px; border: 2px solid; background: var(--pane); }
.stepper { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--edge); }
.seg { display: inline-flex; border: 1px solid var(--btn-edge); }
.seg button { font: inherit; min-width: 30px; height: 26px; border: 0; border-right: 1px solid var(--edge); background: var(--btn-bg); color: var(--btn-ink);
  box-shadow: var(--th-bevel); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--hover); color: var(--btn-ink); }
.seg button[aria-pressed="true"] { background: var(--select); color: var(--select-ink); box-shadow: none; font-weight: 700; }
.seg button[aria-pressed="true"]:hover { background: var(--select); color: var(--select-ink); }
#stepword { width: 100%; }
.card { margin-top: 12px; border: 1px solid var(--edge); border-top: 5px solid var(--c-ok); }
.card.planned { border-top-color: var(--c-info); } .card.key { border-top-color: var(--c-c); }
.card h3 { margin: 0; padding: 7px 12px; font-size: 14px; background: var(--head-bg); color: var(--head-ink); }
.card .st { padding: 6px 12px 0; font-weight: 700; }
.card .st.built { color: var(--ok); } .card .st.planned { color: var(--info); } .card .st.key { color: var(--warn); }
.card h4 { margin: 10px 12px 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.card p, .card ul { margin: 0 12px; } .card ul { padding-left: 16px; } .card li { margin: 2px 0; }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 12px; }
.where { margin: 10px 12px 12px; padding: 6px 8px; background: var(--pane-alt); border: 1px solid var(--edge-soft); }
.where code { font: 12px var(--mono); }
</style>
</head>
<body>
<div class="facts" id="facts"></div>
<div class="diagram">
<svg id="sysmap" viewBox="0 0 1000 470" role="group" aria-labelledby="sysmap-t">
<title id="sysmap-t">The system: sources, archive, registry and evidence, pull requests, dashboard and console</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--axis)"/></marker>
<marker id="arr-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--c-info)"/></marker>
</defs>
<g class="cols"><text x="85" y="16">SOURCES</text><text x="270" y="16">COLLECT</text><text x="450" y="16">KEEP</text><text x="645" y="16">BUILD AND JUDGE</text><text x="875" y="16">DECIDE AND USE</text></g>
<g id="edges">
<path data-e="src-job" d="M160 52H180V165H200"/><path data-e="src-job" d="M160 112H180"/><path data-e="src-job" d="M160 172H180"/><path data-e="src-job" d="M160 232H180"/><path data-e="src-job" d="M160 292H180V165"/>
<path data-e="job-arc" d="M340 165H380"/>
<path data-e="arc-reg" d="M520 150H540V52H560"/>
<path data-e="arc-store" d="M520 175H560"/>
<path data-e="arc-ext" class="planned" d="M520 195H540V292H560"/>
<path data-e="reg-pr" d="M730 52H770"/>
<path data-e="pr-tab" d="M875 74V108"/>
<path data-e="tab-store" d="M770 132H750V160H730"/>
<path data-e="store-bar" d="M730 186H750V212H770"/>
<path data-e="ext-bar" class="planned" d="M730 292H750V224H770"/>
<path data-e="bar-prop" class="planned" d="M875 234V270"/>
<path data-e="prop-pr" class="planned" d="M980 292H992V40H980"/>
<path data-e="tab-dash" d="M770 140H758V392H730"/>
<path data-e="admin-pr" d="M980 392H992V40H980"/>
<path data-e="cel-dash" d="M85 194V446H645V414"/>
<path data-e="job-hc" d="M270 210V300"/>
</g>
<g id="nodes">
<g data-n="igs" class="built"><title>IGS satellite file</title><rect x="10" y="30" width="150" height="44"/><text x="20" y="49">IGS satellite file</text><text x="20" y="65" class="s">grade B · weekly</text></g>
<g data-n="gcat" class="built"><title>GCAT catalogue</title><rect x="10" y="90" width="150" height="44"/><text x="20" y="109">GCAT catalogue</text><text x="20" y="125" class="s">grade C · daily</text></g>
<g data-n="cel" class="built"><title>CelesTrak orbit records</title><rect x="10" y="150" width="150" height="44"/><text x="20" y="169">CelesTrak orbits</text><text x="20" y="185" class="s">grade B · 1 per 2 h</text></g>
<g data-n="news" class="built"><title>News and official feeds</title><rect x="10" y="210" width="150" height="44"/><text x="20" y="229">News and official</text><text x="20" y="245" class="s">44 read every 3 h</text></g>
<g data-n="social" class="built"><title>Social feeds</title><rect x="10" y="270" width="150" height="44"/><text x="20" y="289">Social feeds</text><text x="20" y="305" class="s">for their links only</text></g>
<g data-n="job" class="built"><title>Archive job</title><rect x="200" y="120" width="140" height="90"/><text x="212" y="146">Archive job</text><text x="212" y="164" class="s">5 schedules</text><text x="212" y="180" class="s">retries, back-off</text><text x="212" y="196" class="s">GitHub Actions</text></g>
<g data-n="hc" class="built"><title>Healthchecks.io</title><rect x="200" y="300" width="140" height="44"/><text x="212" y="319">Healthchecks.io</text><text x="212" y="335" class="s">emails on a failure</text></g>
<g data-n="arc" class="built"><title>Archive</title><rect x="380" y="120" width="140" height="90"/><text x="392" y="146">Archive</text><text x="392" y="164" class="s">private repository</text><text x="392" y="180" class="s">copies by fingerprint</text><text x="392" y="196" class="s">run log</text></g>
<g data-n="regjob" class="built"><title>Registry job</title><rect x="560" y="30" width="170" height="44"/><text x="572" y="49">Registry job</text><text x="572" y="65" class="s">Sundays 01:00 UTC</text></g>
<g data-n="store" class="built"><title>Query store</title><rect x="560" y="150" width="170" height="50"/><text x="572" y="170">Query store</text><text x="572" y="187" class="s">rebuilt every run</text></g>
<g data-n="ext" class="planned"><title>Claim extraction (planned)</title><rect x="560" y="270" width="170" height="44"/><text x="572" y="289">Claim extraction</text><text x="572" y="305" class="s">planned · needs a model</text></g>
<g data-n="pr" class="built key"><title>Pull request</title><rect x="770" y="30" width="210" height="44"/><text x="782" y="49">Pull request</text><text x="782" y="65" class="s">the only record · tests run</text></g>
<g data-n="tab" class="built"><title>Registry tables</title><rect x="770" y="110" width="210" height="44"/><text x="782" y="129">Registry tables</text><text x="782" y="145" class="s">which satellite is which</text></g>
<g data-n="bar" class="built"><title>The bar and labels</title><rect x="770" y="190" width="210" height="44"/><text x="782" y="209">The bar and labels</text><text x="782" y="225" class="s">confirmed · probable · unconfirmed</text></g>
<g data-n="prop" class="planned"><title>Change proposals (planned)</title><rect x="770" y="270" width="210" height="44"/><text x="782" y="289">Change proposals</text><text x="782" y="305" class="s">planned · one per event</text></g>
<g data-n="dash" class="built"><title>Dashboard</title><rect x="560" y="370" width="170" height="44"/><text x="572" y="389">Dashboard</text><text x="572" y="405" class="s">Streamlit · orbit maths</text></g>
<g data-n="admin" class="built key"><title>Admin console</title><rect x="770" y="370" width="210" height="44"/><text x="782" y="389">Admin console</text><text x="782" y="405" class="s">sign-in · approve · settings</text></g>
</g>
</svg>
</div>
<div class="legend"><span><b style="border-color:var(--c-ok)"></b>built and running</span><span><b style="border-color:var(--c-info);border-style:dashed"></b>planned</span><span><b style="border-color:var(--c-c)"></b>where a person decides</span><span>Arrows show where data goes. Click a part, or press Tab and Return.</span></div>
<div class="stepper"><b>Follow one item:</b><span class="seg" id="steps"></span><span id="stepword">Press a step to light up where an item goes.</span></div>
<div class="card" id="card" aria-live="polite"></div>
<script>
const DATA = __DATA__;
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
const STATES = { built: "Built and running", planned: "Planned", key: "Where a person decides" };
let stepIndex = -1;   // no step chosen yet; the arrows step from there, and wrap at both ends
for (const f of DATA.facts) { const d = el("div"); d.append(el("b", f.figure), el("span", f.words)); $("#facts").append(d); }
function list(items) { const u = el("ul"); for (const t of items) u.append(el("li", t)); return u; }
function show(key) {
  const p = DATA.parts[key]; if (!p) return;
  $$("#nodes g").forEach((g) => g.classList.toggle("sel", g.dataset.n === key));
  const c = $("#card"); c.className = "card " + p.kind; c.replaceChildren();
  const tech = el("div"), risk = el("div"), cols = el("div", undefined, "cols2");
  tech.append(el("h4", "Key technical details"), list(p.tech)); risk.append(el("h4", "Limits and risks"), list(p.limits)); cols.append(tech, risk);
  const where = el("div", undefined, "where"); where.append(el("span", "Where it lives: "), el("code", p.where));
  c.append(el("h3", p.name), el("div", STATES[p.kind], "st " + p.kind), el("h4", "In simple terms"), el("p", p.simple), cols, where);
}
function step(i) {
  i = ((i % DATA.steps.length) + DATA.steps.length) % DATA.steps.length;
  stepIndex = i;
  const s = DATA.steps[i];
  $$("#steps button.step").forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
  $$("#nodes g").forEach((g) => g.classList.toggle("lit", s.nodes.includes(g.dataset.n)));
  $$("#edges path").forEach((e) => e.classList.toggle("on", s.edges.includes(e.dataset.e)));
  const w = $("#stepword"); w.replaceChildren(el("b", `Step ${i + 1} of ${DATA.steps.length}. `), document.createTextNode(s.words + "."));
  show(s.nodes[0]);
}
function move(delta) {
  const n = DATA.steps.length;
  const current = stepIndex < 0 ? (delta > 0 ? -1 : 0) : stepIndex;
  step((current + delta + n) % n);
}
const steps = $("#steps");
const prev = el("button", "‹", "arrow"); prev.type = "button"; prev.setAttribute("aria-label", "Previous step");
prev.addEventListener("click", () => move(-1)); steps.append(prev);
DATA.steps.forEach((_, i) => { const b = el("button", String(i + 1), "step"); b.type = "button";
  b.setAttribute("aria-pressed", "false"); b.setAttribute("aria-label", `Step ${i + 1}`);
  b.addEventListener("click", () => step(i)); steps.append(b); });
const next = el("button", "›", "arrow"); next.type = "button"; next.setAttribute("aria-label", "Next step");
next.addEventListener("click", () => move(1)); steps.append(next);
steps.setAttribute("tabindex", "0"); steps.setAttribute("role", "group"); steps.setAttribute("aria-label", "Steps");
steps.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") { e.preventDefault(); move(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); move(1); }
});
$$("#nodes g").forEach((g) => { g.setAttribute("tabindex", "0"); g.setAttribute("role", "button");
  g.addEventListener("click", () => show(g.dataset.n));
  g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); show(g.dataset.n); } }); });
show("pr");
</script>
</body>
</html>
