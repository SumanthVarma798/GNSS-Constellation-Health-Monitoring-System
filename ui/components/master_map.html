<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master map</title>
<style>
__ROOT__
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { --mono: __FONT_NUMBERS__; background: var(--platform); color: var(--ink); font: 13.5px/1.4 __FONT__; padding: 14px;
  display: flex; flex-direction: column; gap: 16px; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- the three dropdowns ---- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; position: relative; z-index: 30; }
.dd { position: relative; }
.pill { display: inline-flex; align-items: center; gap: 9px; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--edge);
  background: var(--platform); color: var(--muted); box-shadow: var(--raised-sm); cursor: pointer; font-weight: 600; }
.pill:hover { color: var(--accent); }
.pill.on, .pill[aria-expanded="true"] { background: var(--well); box-shadow: var(--pressed); color: var(--accent); }
.pill .n { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--well); font-size: 12px; text-align: center; }
.caret { width: 7px; height: 7px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: rotate(45deg) translate(-2px, -2px); }
.dd[data-open] .caret { transform: rotate(225deg) translate(-2px, -2px); }
.panel { display: none; position: absolute; top: calc(100% + 12px); left: 0; z-index: 40; min-width: 250px; max-height: min(340px, 62vh);
  overflow-y: auto; margin: 0; padding: 10px; list-style: none; background: var(--platform); border: 1px solid var(--edge);
  border-radius: var(--r); box-shadow: var(--raised); scrollbar-width: thin; scrollbar-color: var(--track) transparent; }
.dd[data-open] .panel { display: block; }
.panel:focus-visible { outline: none; }
.panel li { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 14px; cursor: pointer; color: var(--ink); }
.panel li:hover, .panel li.active { background: var(--well); box-shadow: var(--pressed); }
.panel:focus-visible li.active { outline: 2px solid var(--accent); outline-offset: -2px; }
.box { flex: none; width: 18px; height: 18px; border-radius: 7px; background: var(--well); box-shadow: var(--pressed); display: grid; place-items: center; }
.panel li[aria-selected="true"] .box::after { content: ""; width: 8px; height: 8px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.panel li .count { margin-left: auto; padding-left: 16px; color: var(--muted); font-family: var(--mono); font-size: 12px; }
.clear { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--edge); background: var(--platform); box-shadow: var(--raised-sm); color: var(--muted); cursor: pointer; }
.clear:hover { color: var(--accent); }
.clear:active { box-shadow: var(--pressed); background: var(--well); }
.clear[hidden] { display: none; }

/* ---- the canvas ---- */
.stage { position: relative; flex: 1; min-height: 0; border-radius: var(--r); background: var(--well); box-shadow: var(--pressed); overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.drag { cursor: grabbing; }
.tree { cursor: pointer; transition: opacity .35s ease; }
.tree:focus { outline: none; }
.tree.dim { opacity: .15; }
.tree.dim:hover { opacity: .55; }
.halo { opacity: 0; transition: opacity .35s ease; pointer-events: none; }
.tree.hit .halo { opacity: 1; }
.ring { fill: none; stroke: var(--accent); stroke-width: 1.6; opacity: 0; }
.tree.sel .ring, .tree:focus-visible .ring { opacity: 1; }
.link { stroke: var(--track); stroke-width: 1.1; }
.link.warn { stroke: var(--warn); }
.hub { fill: var(--well); stroke: var(--accent); stroke-width: 1.5; }
.leaf { fill: var(--platform); stroke: var(--track); stroke-width: 1.1; }
.leaf.warn { stroke: var(--warn); }
.leaf.accent { stroke: var(--accent); }
.id { fill: var(--accent); font-size: 9.5px; font-weight: 700; text-anchor: middle; }
.tag { fill: var(--muted); font-size: 8.5px; font-weight: 600; text-anchor: middle; }
.tag.warn, .val.warn { fill: var(--warn); }
.val { fill: var(--ink); font-family: var(--mono); font-size: 7.6px; }
.field-name { fill: var(--muted); font-weight: 600; text-anchor: middle; pointer-events: none; }
#map.far .val { display: none; }
#map.afar .tag, #map.afar .id { display: none; }
#map.afar .hub { transform: scale(2.4); }   /* zoomed far out, each tree is a dot you can still see */
#map.afar .halo { transform: scale(1.5); }
.totals { position: absolute; left: 18px; bottom: 14px; margin: 0; color: var(--muted); font-size: 13px; pointer-events: none; }
.totals b { color: var(--ink); font-family: var(--mono); font-weight: 600; }

/* ---- legend: collapsed until hover or keyboard focus ---- */
.legend { position: absolute; right: 18px; bottom: 14px; z-index: 5; }
.legend-label { display: inline-block; padding: 6px 16px; border-radius: 999px; border: 1px solid var(--edge); background: var(--platform); box-shadow: var(--raised-sm); color: var(--muted); cursor: default; }
.legend:hover .legend-label, .legend:focus-within .legend-label { background: var(--well); box-shadow: var(--pressed); color: var(--accent); }
.legend ul { display: none; position: absolute; right: 0; bottom: calc(100% + 10px); width: max-content; max-width: min(360px, 80vw); margin: 0; padding: 12px 16px; list-style: none;
  background: var(--platform); border: 1px solid var(--edge); border-radius: var(--r); box-shadow: var(--raised); }
.legend:hover ul, .legend:focus-within ul { display: block; }
.legend li { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.legend .dot, .dot { flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--track); background: var(--platform); box-shadow: var(--raised-sm); font-size: 10.5px; font-weight: 700; color: var(--muted); }
.dot.warn { border-color: var(--warn); color: var(--warn); }
.has-side .legend { display: none; }

/* ---- the side panel ---- */
.side { display: none; position: absolute; top: 14px; right: 14px; bottom: 14px; z-index: 10; width: min(350px, calc(100% - 28px)); overflow-y: auto; padding: 20px 20px 22px;
  background: var(--platform); border: 1px solid var(--edge); border-radius: var(--r); box-shadow: var(--raised); scrollbar-width: thin; scrollbar-color: var(--track) transparent; }
.has-side .side { display: block; }
.side h2 { margin: 0; padding-right: 40px; font-family: var(--mono); font-size: 24px; color: var(--accent); }
.side .name { margin: 2px 0 0; padding-right: 40px; font-size: 15px; font-weight: 600; }
.side .where { margin: 2px 0 0; color: var(--muted); }
.close { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--edge); background: var(--platform); box-shadow: var(--raised-sm); color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
.close:hover { color: var(--accent); }
.close:active { box-shadow: var(--pressed); background: var(--well); }
.side dl { margin: 18px 0 0; }
.side .row { display: grid; grid-template-columns: 22px 1fr; column-gap: 12px; margin: 0 0 14px; }
.side dt { grid-row: span 3; margin-top: 2px; }
.side .scheme { color: var(--muted); font-size: 12.5px; }
.side dd { margin: 0; }
.side .value { font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
.side .remark { font-size: 12.5px; color: var(--muted); }
.side .remark.warn { color: var(--warn); }
.side h3 { margin: 22px 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.quiet { margin: 0; color: var(--muted); }
.timeline { display: block; width: 100%; height: auto; }
.timeline text { font-size: 9.5px; fill: var(--muted); }
.timeline text.lab { fill: var(--ink); font-family: var(--mono); font-size: 10px; text-anchor: middle; }
.timeline .bar-p { fill: var(--fill); }
.timeline .bar-p.now { fill: var(--accent); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bar" id="bar"><button type="button" class="clear" id="clear" hidden>Clear</button></div>
<div class="stage" id="stage">
  <svg id="map" role="group" aria-label="Spacecraft and their identifiers"><defs><radialGradient id="glow"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></radialGradient></defs><g id="world"></g></svg>
  <p class="totals" id="totals" aria-live="polite"></p>
  <div class="legend" tabindex="0" id="legend"><span class="legend-label">Key</span><ul id="legend-list"></ul></div>
  <aside class="side" id="side" role="dialog" aria-label="Spacecraft detail"><button type="button" class="close" id="close" aria-label="Close">&times;</button><div id="side-body"></div></aside>
</div>
<script type="application/json" id="map-data">__DATA__</script>
<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById("map-data").textContent);
const RECS = DATA.records;
const $ = id => document.getElementById(id);
const esc = v => String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const svg = $("map"), world = $("world"), stage = $("stage");

/* ---------- seeded randomness: the same spacecraft always lands in the same place ---------- */
const seedOf = text => { let h = 2166136261; for (const c of text) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const random = seed => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

/* ---------- layout: one loose blob per constellation, trees scattered inside, none touching ---------- */
const SX = 140, SY = 100;      // two trees need this much room across and down
const ROOM = 26000;           // plane area given to each tree: loose, not packed
const groups = new Map();
RECS.forEach(r => { if (!groups.has(r.constellation)) groups.set(r.constellation, []); groups.get(r.constellation).push(r); });
const fields = [...groups].map(([name, list]) => {
  const roll = random(seedOf(name)), radius = Math.sqrt(list.length * ROOM / Math.PI);
  return { name, list, radius, angle: roll() * 6.2832, p1: roll() * 6.2832, p2: roll() * 6.2832, cx: 0, cy: 0 };
}).sort((a, b) => b.list.length - a.list.length);
const reach = f => f.radius * 1.25 + 90;
const placed = [];
fields.forEach(f => {
  for (let d = placed.length ? 200 : 0; ; d += 40) {
    f.cx = Math.cos(f.angle) * d; f.cy = Math.sin(f.angle) * d;
    if (placed.every(o => Math.hypot(o.cx - f.cx, o.cy - f.cy) >= reach(o) + reach(f))) break;
  }
  placed.push(f);
});
const cells = new Map(), spot = new Map();
const cellKey = (i, j) => i + "," + j;
const free = (x, y) => {
  const i = Math.floor(x / SX), j = Math.floor(y / SX);
  for (let a = i - 1; a <= i + 1; a++) for (let b = j - 1; b <= j + 1; b++)
    for (const o of cells.get(cellKey(a, b)) || []) if (((o[0] - x) / SX) ** 2 + ((o[1] - y) / SY) ** 2 < 1) return false;
  return true;
};
fields.forEach(f => {
  f.list.forEach(r => {
    const roll = random(seedOf(r.svn));
    let grow = 1, x, y;
    for (let tries = 0; ; tries++) {
      const a = roll() * 6.2832, edge = f.radius * grow * (1 + .14 * Math.sin(2 * a + f.p1) + .08 * Math.sin(3 * a + f.p2)), d = edge * Math.sqrt(roll());
      x = f.cx + Math.cos(a) * d; y = f.cy + Math.sin(a) * d;
      if (free(x, y)) break;
      if (tries % 40 === 39) grow *= 1.06;   // a crowded field widens a little rather than overlap
    }
    const k = cellKey(Math.floor(x / SX), Math.floor(y / SX));
    if (!cells.has(k)) cells.set(k, []);
    cells.get(k).push([x, y]);
    spot.set(r.svn, { x, y, turn: roll() * 6.2832 });
  });
});

/* ---------- drawing ---------- */
const LEAF_R = 36, HUB_R = 15;
const short = v => { v = String(v); return v.length > 11 ? v.slice(0, 10) + "…" : v; };
function drawTree(r) {
  const { x, y, turn } = spot.get(r.svn), n = r.identifiers.length;
  let s = `<g class="tree" data-svn="${esc(r.svn)}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" tabindex="0" role="button" aria-label="${esc(r.svn + ", " + r.name)}"><title>${esc(r.svn + " " + r.name)}</title>`;
  s += `<circle class="halo" r="105" fill="url(#glow)"/><circle class="ring" r="23"/>`;
  r.identifiers.forEach((it, k) => {
    const a = turn + k * 6.2832 / n, c = Math.cos(a), sn = Math.sin(a), lx = c * LEAF_R, ly = sn * LEAF_R, bad = it.status === "warn" ? " warn" : "";
    const cls = bad || (it.status === "accent" ? " accent" : ""), anchor = c > .35 ? "start" : c < -.35 ? "end" : "middle";
    const tx = lx + c * 12.5, ty = ly + sn * 12.5 + (sn > .35 ? 6 : sn < -.35 ? -1 : 2.6);
    s += `<line class="link${bad}" x1="0" y1="0" x2="${lx.toFixed(1)}" y2="${ly.toFixed(1)}"/>`
       + `<circle class="leaf${cls}" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="8"><title>${esc(it.scheme + ": " + it.value)}</title></circle>`
       + `<text class="tag${bad}" x="${lx.toFixed(1)}" y="${(ly + 3).toFixed(1)}">${esc(it.tag)}</text>`
       + `<text class="val${bad}" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}">${esc(short(it.value))}</text>`;
  });
  return s + `<circle class="hub" r="${HUB_R}"/><text class="id" y="3.4">${esc(r.svn)}</text></g>`;
}
world.innerHTML = RECS.map(drawTree).join("");
const trees = new Map([...world.querySelectorAll(".tree")].map(el => [el.dataset.svn, el]));

const labelEls = fields.map(f => {
  const ys = f.list.map(r => spot.get(r.svn).y), top = Math.min(...ys), xs = f.list.map(r => spot.get(r.svn).x);
  const el = document.createElementNS(svg.namespaceURI, "text");
  el.setAttribute("class", "field-name");
  el.setAttribute("x", ((Math.min(...xs) + Math.max(...xs)) / 2).toFixed(1)); el.setAttribute("y", (top - 95).toFixed(1));
  el.textContent = f.name; world.appendChild(el); return el;
});

/* ---------- the view: pan, zoom, and animated moves ---------- */
const KMIN = .06, KMAX = 4;
let view = { x: 0, y: 0, k: 1 }, flight = 0;
function paint() {
  world.setAttribute("transform", `translate(${view.x.toFixed(2)} ${view.y.toFixed(2)}) scale(${view.k.toFixed(4)})`);
  svg.classList.toggle("far", view.k < .5); svg.classList.toggle("afar", view.k < .22);
  const size = (15 / clamp(view.k, .25, 1)).toFixed(1);
  labelEls.forEach(el => el.setAttribute("font-size", size));
}
const box = () => stage.getBoundingClientRect();
function zoomAt(px, py, factor) {
  const k = clamp(view.k * factor, KMIN, KMAX), r = k / view.k;
  view.x = px - (px - view.x) * r; view.y = py - (py - view.y) * r; view.k = k; paint();
}
function fitTo(list) {
  const pts = list.map(r => spot.get(r.svn)), b = box();
  const x0 = Math.min(...pts.map(p => p.x)) - 100, x1 = Math.max(...pts.map(p => p.x)) + 100;
  let y0 = Math.min(...pts.map(p => p.y)) - 115; const y1 = Math.max(...pts.map(p => p.y)) + 70;
  let k = clamp(Math.min(b.width / (x1 - x0), b.height / (y1 - y0)), KMIN, 1.4);
  y0 -= 30 / k;   // room above the field's name, which is 15px tall on screen
  k = clamp(Math.min(b.width / (x1 - x0), b.height / (y1 - y0)), KMIN, 1.4);
  return { k, x: b.width / 2 - (x0 + x1) / 2 * k, y: b.height / 2 - (y0 + y1) / 2 * k };
}
function goTo(to) {
  cancelAnimationFrame(flight);
  if (reduce.matches) { view = { ...to }; paint(); return; }
  const from = { ...view }, t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / 600), e = 1 - Math.pow(1 - p, 3);
    view = { k: from.k * Math.pow(to.k / from.k, e), x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e };
    paint(); if (p < 1) flight = requestAnimationFrame(step);
  };
  flight = requestAnimationFrame(step);
}
const home = () => { const f = fields[0], b = box(); return { k: 1, x: b.width / 2 - f.cx, y: b.height / 2 - f.cy }; };

const pointers = new Map(); let travelled = 0, downOn = null;
svg.addEventListener("pointerdown", e => {
  cancelAnimationFrame(flight); svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { travelled = 0; downOn = e.target.closest(".tree"); svg.classList.add("drag"); } else downOn = null;
});
svg.addEventListener("pointermove", e => {
  const last = pointers.get(e.pointerId); if (!last) return;
  const b = box(), now = { x: e.clientX, y: e.clientY };
  if (pointers.size === 1) {
    view.x += now.x - last.x; view.y += now.y - last.y; travelled += Math.abs(now.x - last.x) + Math.abs(now.y - last.y); paint();
  } else if (pointers.size === 2) {
    const other = [...pointers].find(([id]) => id !== e.pointerId)[1];
    const before = Math.hypot(last.x - other.x, last.y - other.y), after = Math.hypot(now.x - other.x, now.y - other.y);
    view.x += (now.x - last.x) / 2; view.y += (now.y - last.y) / 2;
    if (before > 0) zoomAt((now.x + other.x) / 2 - b.left, (now.y + other.y) / 2 - b.top, after / before); else paint();
  }
  pointers.set(e.pointerId, now);
});
const lift = e => {
  if (!pointers.delete(e.pointerId)) return;
  if (!pointers.size) { svg.classList.remove("drag"); if (e.type === "pointerup" && downOn && travelled < 6) select(downOn.dataset.svn); downOn = null; }
};
svg.addEventListener("pointerup", lift); svg.addEventListener("pointercancel", lift);
svg.addEventListener("wheel", e => {
  e.preventDefault(); cancelAnimationFrame(flight);
  const b = box(), dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomAt(e.clientX - b.left, e.clientY - b.top, Math.exp(-dy * (e.ctrlKey ? .01 : .0015)));
}, { passive: false });
svg.addEventListener("keydown", e => {
  const el = e.target.closest && e.target.closest(".tree");
  if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(el.dataset.svn); }
});

/* ---------- the three dropdowns ---------- */
const FILTERS = [["constellation", "Constellation"], ["country", "Country"], ["sources", "Sources"]];
const SOURCES_ORDER = ["agree", "disagree", "not in catalogue"];
const chosen = Object.fromEntries(FILTERS.map(([key]) => [key, new Set()]));
const menus = [];
function optionsOf(key) {
  const counts = new Map(); RECS.forEach(r => counts.set(r[key], (counts.get(r[key]) || 0) + 1));
  const list = [...counts].map(([value, count]) => ({ value, count }));
  return key === "sources" ? list.sort((a, b) => SOURCES_ORDER.indexOf(a.value) - SOURCES_ORDER.indexOf(b.value)) : list.sort((a, b) => b.count - a.count || a.value.localeCompare(b.value));
}
function openMenu(m, on) {
  if (on) menus.forEach(o => o !== m && openMenu(o, false));
  m.root.toggleAttribute("data-open", on); m.pill.setAttribute("aria-expanded", on);
  if (on) { m.list.focus(); setActive(m, m.at); } else m.list.removeAttribute("aria-activedescendant");
}
function setActive(m, at) {
  m.at = clamp(at, 0, m.items.length - 1);
  m.items.forEach((li, i) => li.classList.toggle("active", i === m.at));
  m.list.setAttribute("aria-activedescendant", m.items[m.at].id);
  m.items[m.at].scrollIntoView({ block: "nearest" });
}
function toggle(m, i) {
  const value = m.options[i].value, set = chosen[m.key];
  set.has(value) ? set.delete(value) : set.add(value);
  m.items[i].setAttribute("aria-selected", set.has(value));
  refresh(true);
}
FILTERS.forEach(([key, label]) => {
  const options = optionsOf(key), root = document.createElement("div");
  root.className = "dd";
  root.innerHTML = `<button type="button" class="pill" aria-haspopup="listbox" aria-expanded="false" aria-controls="list-${key}"><span class="t">${label}</span><span class="n" hidden></span><i class="caret"></i></button>`
    + `<ul class="panel" id="list-${key}" role="listbox" aria-multiselectable="true" aria-label="${label}" tabindex="-1">`
    + options.map((o, i) => `<li role="option" id="opt-${key}-${i}" aria-selected="false"><span class="box"></span><span>${esc(o.value)}</span><span class="count">${o.count}</span></li>`).join("") + `</ul>`;
  $("bar").insertBefore(root, $("clear"));
  const m = { key, root, options, pill: root.querySelector(".pill"), list: root.querySelector(".panel"), badge: root.querySelector(".n"), items: [...root.querySelectorAll("li")], at: 0 };
  menus.push(m);
  m.pill.addEventListener("click", () => openMenu(m, !root.hasAttribute("data-open")));
  m.pill.addEventListener("keydown", e => { if (e.key === "ArrowDown") { e.preventDefault(); openMenu(m, true); } });
  m.list.addEventListener("mousedown", e => e.preventDefault());
  m.items.forEach((li, i) => li.addEventListener("click", () => { setActive(m, i); toggle(m, i); }));
  m.list.addEventListener("keydown", e => {
    const move = { ArrowDown: m.at + 1, ArrowUp: m.at - 1, Home: 0, End: m.items.length - 1 }[e.key];
    if (move !== undefined) { e.preventDefault(); setActive(m, move); }
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(m, m.at); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); openMenu(m, false); m.pill.focus(); }
    else if (e.key === "Tab") openMenu(m, false);
  });
});
document.addEventListener("pointerdown", e => menus.forEach(m => { if (!m.root.contains(e.target)) openMenu(m, false); }));

/* ---------- focus and context ---------- */
const shownTotal = RECS.length;
function refresh(move) {
  const active = FILTERS.map(([key]) => key).filter(key => chosen[key].size);
  const hits = RECS.filter(r => active.every(key => chosen[key].has(r[key])));
  const hitSet = new Set(hits.map(r => r.svn)), filtered = active.length > 0;
  trees.forEach((el, svn) => {
    const on = !filtered || hitSet.has(svn);
    el.classList.toggle("dim", !on); el.classList.toggle("hit", filtered && on); el.setAttribute("tabindex", on ? "0" : "-1");
  });
  menus.forEach(m => { const n = chosen[m.key].size; m.pill.classList.toggle("on", n > 0); m.badge.hidden = !n; m.badge.textContent = n; });
  $("clear").hidden = !filtered;
  $("totals").innerHTML = `<b>${hits.length}</b> / ${shownTotal} shown · <b>${hits.filter(r => r.sources === "disagree").length}</b> disagree`;
  if (move) { if (!filtered) goTo(home()); else if (hits.length) goTo(fitTo(hits)); }
}
$("clear").addEventListener("click", () => {
  FILTERS.forEach(([key]) => chosen[key].clear()); menus.forEach(m => m.items.forEach(li => li.setAttribute("aria-selected", "false"))); refresh(true);
});

/* ---------- the side panel ---------- */
let current = null;
function timeline(periods) {
  if (!periods.length) return `<p class="quiet">None on record</p>`;
  const today = new Date().toISOString().slice(0, 10), W = 300, pad = 8;
  const from = Date.parse(periods[0].start), to = Math.max(...periods.map(p => Date.parse(p.end || today)));
  const at = d => pad + (Date.parse(d) - from) / Math.max(1, to - from) * (W - 2 * pad);
  let bars = "", marks = "", edge = -99, label = -99, lift = false;
  periods.forEach(p => {
    const x0 = at(p.start), x1 = at(p.end || today), mid = (x0 + x1) / 2, half = p.label.length * 3;
    lift = mid - half < label + 4 ? !lift : false; label = mid + half;
    bars += `<rect class="bar-p${p.current ? " now" : ""}" x="${x0.toFixed(1)}" y="34" width="${Math.max(3, x1 - x0).toFixed(1)}" height="11" rx="5"><title>${esc(p.label + ": " + p.start + " to " + (p.end || "now"))}</title></rect>`
          + `<text class="lab" x="${mid.toFixed(1)}" y="${lift ? 12 : 26}">${esc(p.label)}</text>`;
    if (x0 - edge >= 34 && x0 < W - pad - 34) { marks += `<text x="${x0.toFixed(1)}" y="61">${esc(p.start.slice(0, 4))}</text>`; edge = x0; }
  });
  const last = periods[periods.length - 1];
  marks += `<text x="${W - pad}" y="61" text-anchor="end">${last.end ? esc(last.end.slice(0, 4)) : "now"}</text>`;
  const said = periods.map(p => `${p.label} from ${p.start}${p.end ? " to " + p.end : ", current"}`).join("; ");
  return `<svg class="timeline" viewBox="0 0 ${W} 68" role="img" aria-label="${esc(said)}">${bars}${marks}</svg>`;
}
function select(svn) {
  const r = RECS.find(x => x.svn === svn); if (!r) return;
  if (current) trees.get(current).classList.remove("sel");
  current = svn; trees.get(svn).classList.add("sel");
  $("side-body").innerHTML = `<h2>${esc(r.svn)}</h2><p class="name">${esc(r.name)}</p><p class="where">${esc(r.constellation)} · ${esc(r.country)}</p>`
    + `<dl>${r.identifiers.map(it => `<div class="row"><dt><span class="dot${it.status === "warn" ? " warn" : ""}">${esc(it.tag)}</span></dt><dd class="scheme">${esc(it.scheme)}</dd><dd class="value">${esc(it.value)}</dd>`
      + (it.remark ? `<dd class="remark${it.status === "warn" ? " warn" : ""}">${esc(it.remark)}</dd>` : "") + `</div>`).join("")}</dl>`
    + `<h3>Signal IDs over time</h3>${timeline(r.periods)}`;
  stage.classList.add("has-side"); $("side").scrollTop = 0; $("close").focus({ preventScroll: true });
}
function deselect() {
  if (!current) return;
  trees.get(current).classList.remove("sel"); stage.classList.remove("has-side");
  const el = trees.get(current); current = null; el.focus({ preventScroll: true });
}
$("close").addEventListener("click", deselect);
document.addEventListener("keydown", e => { if (e.key === "Escape" && current) { e.preventDefault(); deselect(); } });

/* ---------- the legend ---------- */
$("legend-list").innerHTML = DATA.tags.map(t => `<li><span class="dot">${esc(t.tag)}</span>${esc(t.scheme)}</li>`).join("")
  + `<li><span class="dot warn">!</span>Worth a person's look</li>`;

/* ---------- start ---------- */
view = home(); paint(); refresh(false);
addEventListener("resize", () => { view = current || FILTERS.some(([key]) => chosen[key].size) ? view : home(); paint(); });
})();
</script>
</body>
</html>
