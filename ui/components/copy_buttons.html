<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
__ROOT__
html, body { margin: 0; background: transparent; }
body { font: var(--fs-small)/1.45 __FONT__; color: var(--ink); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
button {
  flex: 1 1 160px;
  width: 100%;
  min-height: 44px;
  font: inherit;
  color: var(--ink);
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--platform);
  box-shadow: var(--raised-sm);
  padding: 6px 12px;
  cursor: pointer;
}
button:hover { color: var(--accent); border-color: var(--accent); }
button:active { box-shadow: var(--pressed); background: var(--well); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { position: absolute; inline-size: 1px; block-size: 1px; margin: -1px; border: 0; padding: 0; overflow: hidden;
  clip-path: inset(100%); white-space: nowrap; }
</style>
</head>
<body>
  <div class="btns" id="btns"></div>
  <div class="status" id="status" aria-live="polite"></div>
<script>
(() => {
  "use strict";
  const controls = __DATA__;
  const buttons = document.getElementById("btns");
  const status = document.getElementById("status");
  const stamp = () => {
    const now = new Date();
    const hh = String(now.getUTCHours()).padStart(2, "0");
    const mm = String(now.getUTCMinutes()).padStart(2, "0");
    return now.toISOString().slice(0, 10) + " " + hh + ":" + mm + " UTC";
  };
  const wordsAtClick = text => text.replaceAll("{accessed}", stamp());
  const fitFrame = () => {   // the frame takes its content's height: nothing clipped, no gap (as the other frames)
    if (window.frameElement) window.frameElement.style.height = Math.ceil(document.body.getBoundingClientRect().height) + 4 + "px";
  };
  const say = message => { status.textContent = ""; status.textContent = message; };
  const copy = async (button, text) => {   // the button says what happened, then goes back to its words
    const label = button.dataset.label || button.textContent;
    const value = wordsAtClick(text);
    let done = false;
    try { await navigator.clipboard.writeText(value); done = true; }
    catch (err) {   // a frame may be refused the clipboard: copy the old way, from a selected hidden copy of the text
      const hold = document.createElement("textarea");
      hold.value = value; hold.setAttribute("readonly", ""); hold.style.position = "fixed"; hold.style.left = "-9999px";
      document.body.append(hold); hold.select();
      try { done = document.execCommand("copy"); } catch (e) { done = false; }
      hold.remove();
    }
    const message = done ? "Copied" : "Copy failed: use Download below";
    button.textContent = message;
    say(message);
    fitFrame();
    setTimeout(() => { button.textContent = label; fitFrame(); }, 2000);
  };
  Object.entries(controls).forEach(([label, text], index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.label = label;
    button.textContent = label;
    button.id = "copy-" + index;
    button.addEventListener("click", () => copy(button, text));
    buttons.append(button);
  });
  fitFrame();
  if ("ResizeObserver" in window) new ResizeObserver(fitFrame).observe(document.body);
  else addEventListener("resize", fitFrame);   // older browsers: fit again when the width changes, and after each copy
})();
</script>
</body>
</html>
