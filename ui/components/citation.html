<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
__ROOT__
html, body { margin: 0; background: transparent; }
body { font: var(--fs-small)/1.45 __FONT__; color: var(--ink); }
.box { background: var(--well); border: 1px solid var(--edge); border-radius: var(--r); box-shadow: var(--pressed); padding: 10px 12px; }
.line { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.line:last-of-type { margin-bottom: 10px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; color: var(--ink); border: 1px solid var(--edge); border-radius: 999px; background: var(--platform); box-shadow: var(--raised-sm); padding: 5px 12px; cursor: pointer; }
button:hover { color: var(--accent); border-color: var(--accent); }
button:active { box-shadow: var(--pressed); background: var(--well); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="box">
    <p class="line" id="short"></p>
    <p class="line" id="long"></p>
    <div class="btns">
      <button type="button" id="copy-short">Copy short citation</button>
      <button type="button" id="copy-long">Copy long citation</button>
    </div>
  </div>
<script>
(() => {
  "use strict";
  const citation = __DATA__;
  const shortLine = document.getElementById("short");
  const longLine = document.getElementById("long");
  const shortBtn = document.getElementById("copy-short");
  const longBtn = document.getElementById("copy-long");
  const yearOf = stamp => stamp.slice(0, 4);
  const fill = stamp => {
    shortLine.textContent = citation.short.replace("{year}", yearOf(stamp));
    longLine.textContent = citation.long.replace("{year}", yearOf(stamp)).replace("{accessed}", stamp);
  };
  const stamp = () => {
    const now = new Date();
    const hh = String(now.getUTCHours()).padStart(2, "0");
    const mm = String(now.getUTCMinutes()).padStart(2, "0");
    const ss = String(now.getUTCSeconds()).padStart(2, "0");
    return now.toISOString().slice(0, 10) + " " + hh + ":" + mm + ":" + ss;
  };
  const copy = async (button, text) => {   // the button says what happened, then goes back to its words
    const words = button.textContent;
    let done = false;
    try { await navigator.clipboard.writeText(text); done = true; }
    catch (err) {   // a frame may be refused the clipboard: copy the old way, from a selected hidden copy of the text
      const hold = document.createElement("textarea");
      hold.value = text; hold.setAttribute("readonly", ""); hold.style.position = "fixed"; hold.style.left = "-9999px";
      document.body.append(hold); hold.select();
      try { done = document.execCommand("copy"); } catch (e) { done = false; }
      hold.remove();
    }
    button.textContent = done ? "Copied" : "Copy failed: select the text instead";
    setTimeout(() => { button.textContent = words; }, 2000);
  };
  shortBtn.addEventListener("click", () => copy(shortBtn, shortLine.textContent));
  longBtn.addEventListener("click", () => copy(longBtn, longLine.textContent));
  const fitFrame = () => {   // the frame takes its content's height: nothing clipped, no gap (as the other frames)
    if (window.frameElement) window.frameElement.style.height = Math.ceil(document.body.getBoundingClientRect().height) + 4 + "px";
  };
  fill(stamp());
  fitFrame();
  if ("ResizeObserver" in window) new ResizeObserver(fitFrame).observe(document.body);   // older browsers: the first fit only
  setInterval(() => fill(stamp()), 1000);
})();
</script>
</body>
</html>
