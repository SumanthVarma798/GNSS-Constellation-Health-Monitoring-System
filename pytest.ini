[pytest]
pythonpath = .
testpaths = tests
# Three older scripts in tests/ are not pytest tests: they import modules by
# names that no longer exist (e.g. `import health_assessment`) or need live
# Space-Track credentials. They are left untouched and skipped here.
addopts =
    --ignore=tests/test_health_run.py
    --ignore=tests/test_qzs6_commission.py
    --ignore=tests/test_qzs6_analysis.py
