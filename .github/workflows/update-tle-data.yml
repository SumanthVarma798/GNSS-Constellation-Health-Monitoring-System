# Weekly update: CelesTrak orbit records always, Space-Track history only with a login
# for new days, one login per run, paced requests; pushes to main only after tests pass;
# reports each run to Healthchecks.io.

name: Update TLE Data

on:
  # Run every Sunday at 00:00 UTC
  schedule:
    - cron: '0 0 * * 0'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write  # Explicitly grant write permissions

jobs:
  update-data:
    # Only in the private working copy. Anyone who copies this file elsewhere must opt in.
    if: github.repository == 'SumanthVarma798/GNSS-Constellation-Health-Monitoring-System'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # about 40 satellites, 3 s apart, plus the tests
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a token with write permissions
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch full history for proper git operations
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Create data directory if needed
        run: |
          mkdir -p data
          echo "Data directory structure:"
          ls -la data/ || echo "data/ directory is empty"
      
      - name: Run update script
        id: update
        continue-on-error: true
        env:
          SPACETRACK_USERNAME: ${{ secrets.SPACETRACK_USERNAME }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: |
          echo "Starting data update..."
          python scripts/update_bundled_data.py --days 365 --constellation all
          echo "Update script completed"
      
      - name: Verify data was created
        run: |
          echo "Checking for generated files..."
          ls -lh data/
          if [ -z "$(ls -A data/)" ]; then
            echo "WARNING: No files generated in data/ directory"
            exit 1
          fi
          echo "✅ Data files generated successfully"
      
      - name: Check for changes
        id: check_changes
        run: |
          shopt -s nullglob
          files=(data/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            git add "${files[@]}"
          fi
          if git diff --staged --quiet; then
            echo "No changes detected"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in data directory"
            echo "changes=true" >> $GITHUB_OUTPUT
            git diff --staged --stat
          fi

      - name: Run tests
        if: steps.check_changes.outputs.changes == 'true'
        run: python -m pytest -q
      
      - name: Configure git
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git commit -m "🛰️ Auto-update TLE and GP history data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push || { git pull --rebase && git push; }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Report status
        if: always()
        run: |
          if [ "${{ steps.update.outcome }}" == "failure" ]; then
            echo "⚠️ The update step failed; see it above. Any CelesTrak changes were still saved."
          elif [ "${{ steps.check_changes.outputs.changes }}" == "true" ]; then
            echo "✅ Data updated and pushed successfully"
          else
            echo "ℹ️ No changes to commit"
          fi

      - name: Fail if update step failed
        if: always() && steps.update.outcome == 'failure'
        run: |
          echo "Update step failed."
          exit 1

      - name: Tell Healthchecks.io how the run went
        if: always()
        env:
          KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}  # set by Sumanth; nothing is sent until it exists
          OUTCOME: ${{ job.status == 'success' && '0' || '1' }}  # 0 = it worked, 1 = it failed
        run: |
          if [ -z "$KEY" ]; then
            echo "Not reported to Healthchecks.io: no key."
            exit 0
          fi
          KEY=$(printf %s "$KEY" | tr -d '[:space:]')  # a pasted key can carry a newline
          curl -fsS -m 10 --retry 3 --data-raw "Update TLE Data run ${{ github.run_id }}: ${{ job.status }}" \
            "https://hc-ping.com/$KEY/update-tle-data/$OUTCOME" \
            || echo "::warning::Healthchecks.io did not take this report. A 404 means the ping key is wrong or there is no check with the slug update-tle-data. It will report the run as late."
