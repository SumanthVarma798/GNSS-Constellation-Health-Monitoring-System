name: X discovery

on:
  push:
    branches: [x-discovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.repository == 'SumanthVarma798/GNSS-Constellation-Health-Monitoring-System'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run discovery
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: python scripts/discover_x_sources.py --out out
      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: x-discovery
          path: out/
