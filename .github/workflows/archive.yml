# Keeps a raw copy of every archived source whenever it changes.
# Writes to the private archive repository only, and only when something changed.
# "Last checked" is the time of this job's last successful run for that group.
# Every run adds one line to the archive's run log, runs/archive.csv. A failed download is tried
# again (see DOWNLOAD_TRIES in evidence/settings.py), never sooner than the source's minimum gap.
# A failed run fails the job, and GitHub emails whoever last edited the schedule lines below.
#
# CADENCE IS SET HERE. Each group of sources (see evidence/sources.py) has one
# schedule line below. To change how often a group is fetched, change its line
# AND the matching line in the "Which group is due?" step; a test checks the
# two agree. GitHub's clock is UTC: India time is 5 hours 30 minutes ahead.
# GitHub may start a run some minutes late.

name: Archive sources

on:
  schedule:
    - cron: '30 0 * * *'  # documents: once a day, 00:30 UTC = 06:00 India time
    - cron: '45 0 * * *'  # catalogues: once a day, 00:45 UTC = 06:15 India time, after the catalogue's own daily rebuild
    - cron: '15 1 * * *'  # orbital: once a day, 01:15 UTC = 06:45 India time; CelesTrak allows one download per 2 hours
  workflow_dispatch:
    inputs:
      group:
        description: Which group to fetch
        type: choice
        options: [all, documents, catalogues, orbital, news]
        default: all

permissions:
  contents: read  # this repository is only read; the archive is written through its own key

concurrency:
  group: archive-sources  # two runs at once would race to push the same rows
  cancel-in-progress: false

jobs:
  archive:
    # Only in the private working copy. Anyone who copies this file elsewhere must opt in.
    if: github.repository == 'SumanthVarma798/GNSS-Constellation-Health-Monitoring-System'
    runs-on: ubuntu-latest
    timeout-minutes: 20  # retries: up to 3 tries of 60 s, 60 s apart, for each of the 2 catalogues
    steps:
      - uses: actions/checkout@v4
      - name: Check out the archive
        uses: actions/checkout@v4
        with:
          repository: SumanthVarma798/GNSS-Constellation-Health-Monitoring-System-archive
          ssh-key: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
          path: archive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # matches runtime.txt
      - name: Install the one library the archive needs
        run: pip install "$(grep '^requests==' requirements.txt)"

      - name: Which group is due?
        id: due
        env:
          SCHEDULE: ${{ github.event.schedule }}  # the schedule line that started this run; empty when started by hand
          CHOSEN: ${{ inputs.group }}
        run: |
          case "$SCHEDULE" in
            '30 0 * * *') group=documents ;;
            '45 0 * * *') group=catalogues ;;
            '15 1 * * *') group=orbital ;;
            '') group="${CHOSEN:-all}" ;;
            *) echo "No group is assigned to the schedule '$SCHEDULE'. Add it to this step."; exit 1 ;;
          esac
          echo "Fetching: $group"
          echo "group=$group" >> "$GITHUB_OUTPUT"

      - name: Fetch the group and keep what changed
        id: fetch
        continue-on-error: true  # keep what did change, then fail below so the failure is noticed
        env:
          GROUP: ${{ steps.due.outputs.group }}
        run: |
          if [ "$GROUP" = all ]; then
            python scripts/archive_sources.py --archive archive
          else
            python scripts/archive_sources.py --archive archive --group "$GROUP"
          fi

      - name: Save the changes and the run log line to the archive
        working-directory: archive
        run: |
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Archive run, new copies: $(git diff --cached --name-only -- objects | wc -l | tr -d ' ')"
          # The registry job may have saved its own run log line meanwhile; it never touches these files.
          git push --quiet || { git pull --rebase --quiet && git push --quiet; }

      - name: Fail if any source could not be fetched
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "At least one source could not be fetched. See the step above."
          exit 1
