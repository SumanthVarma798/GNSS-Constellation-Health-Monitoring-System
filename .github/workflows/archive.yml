# Keeps a raw copy of every archived source whenever it changes.
# Writes to the private archive repository only, and only when something changed.
# "Last checked" is the time of this job's last successful run for that group.
# Every run adds one line to the archive's run log, runs/archive.csv. A failed download is tried
# again (see DOWNLOAD_TRIES in evidence/settings.py), never sooner than the source's minimum gap.
# Each run then tells Healthchecks.io how it went, with its log line: one check per group, named
# archive-<group>. Healthchecks.io emails when a run fails, or when none arrives within its grace time.
# A second job publishes latest_news.json on this repo's news-data branch for the dashboard, and a third
# publishes latest_gnss.json, the newest CelesTrak GNSS copy, on branch orbit-data (CelesTrak refuses the dashboard).
#
# CADENCE IS SET HERE. Each group of sources (see evidence/sources.py) has one
# schedule line below. To change how often a group is fetched, change its line
# AND the matching line in the "Which group is due?" step; a test checks the
# two agree. GitHub's clock is UTC: India time is 5 hours 30 minutes ahead.
# GitHub may start a run some minutes late.

name: Archive sources

on:
  schedule:
    - cron: '30 0 * * *'  # documents: once a day, 00:30 UTC = 06:00 India time
    - cron: '45 0 * * *'  # catalogues: once a day, 00:45 UTC = 06:15 India time, after the catalogue's own daily rebuild
    - cron: '15 1,8,14,20 * * *'  # orbital: four times a day from 01:15 UTC = 06:45 India time; CelesTrak allows one download per 2 hours
    #   Four, so one missed run leaves the dashboard's copy hours old, not a day; the times keep 2 hours clear of
    #   orbit-ages (03:30) and rinex-check (06:00), which also ask CelesTrak.
    - cron: '50 */3 * * *'  # news: every 3 hours from 00:50 UTC = 06:20 India time; first, to measure how often feeds change (issue 13)
    - cron: '40 1 * * *'  # social: once a day, 01:40 UTC = 07:10 India time; Reddit refuses requests in quick succession
    - cron: '55 */6 * * *'  # x: every 6 hours from 00:55 UTC; each read is paid (twitterapi.io), one page per account
  workflow_dispatch:
    inputs:
      group:
        description: Which group to fetch
        type: choice
        options: [all, documents, catalogues, orbital, news, social, x]
        default: all

permissions:
  contents: read  # this repository is only read; the archive is written through its own key

concurrency:
  group: archive-sources  # two runs at once would race to push the same rows
  cancel-in-progress: false

jobs:
  archive:
    # Only in the private working copy. Anyone who copies this file elsewhere must opt in.
    if: github.repository == 'SumanthVarma798/GNSS-Constellation-Health-Monitoring-System'
    runs-on: ubuntu-latest
    outputs:
      group: ${{ steps.due.outputs.group }}
    timeout-minutes: 35  # the fetch step's limit below, plus time to save
    steps:
      - uses: actions/checkout@v4
      - name: Check out the archive
        uses: actions/checkout@v4
        with:
          repository: SumanthVarma798/GNSS-Constellation-Health-Monitoring-System-archive
          ssh-key: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
          path: archive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # matches runtime.txt
      - name: Install the one library the archive needs
        run: pip install "$(grep '^requests==' requirements.txt)"

      - name: Which group is due?
        id: due
        env:
          SCHEDULE: ${{ github.event.schedule }}  # the schedule line that started this run; empty when started by hand
          CHOSEN: ${{ inputs.group }}
        run: |
          case "$SCHEDULE" in
            '30 0 * * *') group=documents ;;
            '45 0 * * *') group=catalogues ;;
            '15 1,8,14,20 * * *') group=orbital ;;
            '50 */3 * * *') group=news ;;
            '40 1 * * *') group=social ;;
            '55 */6 * * *') group=x ;;
            '') group="${CHOSEN:-all}" ;;
            *) echo "No group is assigned to the schedule '$SCHEDULE'. Add it to this step."; exit 1 ;;
          esac
          echo "Fetching: $group"
          echo "group=$group" >> "$GITHUB_OUTPUT"

      - name: Fetch the group and keep what changed
        id: fetch
        continue-on-error: true  # keep what did change, then fail below so the failure is noticed
        # A source that never answers costs about 5 minutes (3 tries of 60 s, 60 s apart); news has 44 sources.
        # Stopping here, not at the job's limit, lets the steps below still save what was fetched.
        timeout-minutes: 30
        env:
          GROUP: ${{ steps.due.outputs.group }}
          # Only the runs that read X get the key (read by evidence/x_reader.py); every other group gets an empty value.
          TWITTERAPI_IO_KEY: ${{ (steps.due.outputs.group == 'x' || steps.due.outputs.group == 'all') && secrets.TWITTERAPI_IO_KEY || '' }}
        run: |
          if [ "$GROUP" = all ]; then
            python scripts/archive_sources.py --archive archive
          else
            python scripts/archive_sources.py --archive archive --group "$GROUP"
          fi

      - name: Save the changes and the run log line to the archive
        working-directory: archive
        run: |
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The console finds each run's commit by this run id: the hash can change when the push below rebases, the message cannot.
          git commit --quiet -m "Archive run ${{ github.run_id }}, new copies: $(git diff --cached --name-only --diff-filter=A -- objects | wc -l | tr -d ' ')"
          # The registry job may have saved its own run log line meanwhile; it never touches these files.
          git push --quiet || { git pull --rebase --quiet && git push --quiet; }

      - name: Fail if the fetch run broke or a graded source could not be fetched
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "The fetch run did not finish cleanly, or a graded source could not be fetched. See the step above."
          exit 1

      - name: Tell Healthchecks.io how the run went
        if: always()
        env:
          KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}  # set by Sumanth; nothing is sent until it exists
          GROUP: ${{ steps.due.outputs.group }}
          OUTCOME: ${{ job.status == 'success' && '0' || '1' }}  # 0 = it worked, 1 = it failed
        run: |
          if [ -z "$KEY" ] || [ -z "$GROUP" ] || [ "$GROUP" = all ]; then
            echo "Not reported to Healthchecks.io: no key, or not one scheduled group."
            exit 0
          fi
          KEY=$(printf %s "$KEY" | tr -d '[:space:]')  # a pasted key can carry a newline
          tail -n 1 archive/runs/archive.csv 2>/dev/null \
            | curl -fsS -m 10 --retry 3 --data-binary @- "https://hc-ping.com/$KEY/archive-$GROUP/$OUTCOME" \
            || echo "::warning::Healthchecks.io did not take this report. A 404 means the ping key is wrong or there is no check with the slug archive-$GROUP. It will report the run as late."

  publish-news:
    # The dashboard reads this file from news-data; main gets no commit noise, history stays there, and no run
    # with unchanged news makes a commit.
    if: github.repository == 'SumanthVarma798/GNSS-Constellation-Health-Monitoring-System' && always() && (needs.archive.outputs.group == 'news' || needs.archive.outputs.group == 'x' || needs.archive.outputs.group == 'all')
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check out the archive
        uses: actions/checkout@v4
        with:
          repository: SumanthVarma798/GNSS-Constellation-Health-Monitoring-System-archive
          ssh-key: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
          path: archive
      - name: Check out news-data
        uses: actions/checkout@v4
        with:
          ref: news-data
          path: news-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # matches runtime.txt
      - name: Install the one library the archive needs
        run: pip install "$(grep '^requests==' requirements.txt)"
      - name: Build latest news for the dashboard
        run: python scripts/news_items.py --archive archive --latest news-data/latest_news.json
      - name: Commit and push only when latest_news.json changed
        working-directory: news-data
        run: |
          git add latest_news.json
          if git diff --cached --quiet; then
            echo "No latest-news change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Latest news for the dashboard"
          git push --quiet

  publish-orbits:
    # CelesTrak refuses the hosted dashboard but answers GitHub, so the dashboard reads only this copy from orbit-data
    # and never contacts CelesTrak itself (data/celestrak.py, COPY_URL). Never touches main; an unchanged copy makes
    # no commit.
    if: github.repository == 'SumanthVarma798/GNSS-Constellation-Health-Monitoring-System' && always() && (needs.archive.outputs.group == 'orbital' || needs.archive.outputs.group == 'all')
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check out the archive
        uses: actions/checkout@v4
        with:
          repository: SumanthVarma798/GNSS-Constellation-Health-Monitoring-System-archive
          ssh-key: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
          path: archive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # matches runtime.txt
      - name: Install the one library the archive needs
        run: pip install "$(grep '^requests==' requirements.txt)"
      - name: Write latest_gnss.json on orbit-data, made on the first run
        run: |
          if git ls-remote --exit-code --heads origin orbit-data >/dev/null 2>&1; then
            git fetch --quiet origin orbit-data
            git worktree add "$RUNNER_TEMP/orbit-data" --detach FETCH_HEAD
            cd "$RUNNER_TEMP/orbit-data"
            git switch --quiet -C orbit-data
          else
            git worktree add "$RUNNER_TEMP/orbit-data" --detach
            cd "$RUNNER_TEMP/orbit-data"
            git checkout --quiet --orphan orbit-data
            git rm -rf --quiet . >/dev/null 2>&1 || true
          fi
          python "$GITHUB_WORKSPACE/scripts/latest_orbits.py" --archive "$GITHUB_WORKSPACE/archive" --out latest_gnss.json
          git add latest_gnss.json
          if git diff --cached --quiet; then
            echo "No orbit copy change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Latest CelesTrak GNSS copy for the dashboard"
          git push --quiet --set-upstream origin orbit-data
