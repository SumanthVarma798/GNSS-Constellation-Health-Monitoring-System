# Rebuilds the satellite registry once a week from the archived copy of the IGS file.
# If the tables changed, it proposes the change as a pull request for a person
# to review. It never writes to main. Every run adds one line to the archive's run log,
# runs/registry-update.csv, then tells Healthchecks.io how it went (check registry-update), which emails when
# a run fails or none arrives within its grace time.

name: Registry update

on:
  schedule:
    # Sundays 01:00 UTC = 06:30 India time: half an hour after that day's
    # documents fetch (see archive.yml), so the registry builds from a fresh copy.
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write        # to push the proposal branch
  pull-requests: write   # to open the pull request
  actions: write         # to start the Tests job on the proposal branch

jobs:
  propose:
    # Only in the private working copy. Anyone who copies this file elsewhere must opt in.
    if: github.repository == 'SumanthVarma798/GNSS-Constellation-Health-Monitoring-System'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Note the start
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - name: Check out the archive
        uses: actions/checkout@v4
        with:
          repository: SumanthVarma798/GNSS-Constellation-Health-Monitoring-System-archive
          ssh-key: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
          path: archive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # matches runtime.txt
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Rebuild the tables and describe what changed
        id: build
        run: python scripts/build_registry.py --archive archive --report "$RUNNER_TEMP/registry-changes.md"

      - name: Did anything change?
        id: tables
        run: |
          if git diff --quiet -- registry/; then
            echo "Nothing changed at the source. No proposal needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the tests on the new tables
        id: tests
        if: steps.tables.outputs.changed == 'true'
        run: python -m pytest -q

      - name: Open or update the proposal
        id: propose
        if: steps.tables.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C registry-update
          git add registry/
          git commit -m "Registry update from the IGS satellite metadata file"
          git push --force origin registry-update
          if [ -n "$(gh pr list --head registry-update --state open --json number --jq '.[].number')" ]; then
            gh pr edit registry-update --add-label "decision: registry update" --body-file "$RUNNER_TEMP/registry-changes.md"
          else
            gh pr create --base main --head registry-update \
              --title "Registry update from the IGS satellite metadata file" --label "decision: registry update" --body-file "$RUNNER_TEMP/registry-changes.md"
          fi
          # A pull request opened with this job's token starts no other job, so start the Tests job on its branch:
          # its result shows on the pull request, and the admin page merges only once it has passed.
          gh workflow run tests.yml --ref registry-update

      - name: Add this run's line to the run log
        if: always()
        working-directory: archive
        env:
          STARTED: ${{ steps.start.outputs.at }}
          RESULT: ${{ job.status }}
          CHANGED: >-
            ${{ job.status != 'success' && (steps.build.outcome == 'failure' && 'failed at: rebuilding the tables'
            || steps.tests.outcome == 'failure' && 'failed at: the tests on the new tables'
            || steps.propose.outcome == 'failure' && 'failed at: opening the proposal'
            || steps.build.outcome == 'skipped' && 'failed at: checking out or installing'
            || 'failed at a step not named here: see the run on GitHub')
            || steps.propose.outcome == 'success' && 'tables changed, proposal opened or updated'
            || steps.tables.outputs.changed == 'true' && 'tables changed, no proposal made'
            || 'nothing' }}
        run: |
          python ../scripts/log_run.py --archive . --log registry-update --job "registry update" \
            --started "$STARTED" --result "$RESULT" --changed "$CHANGED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/registry-update.csv
          git commit --quiet -m "Registry run: $RESULT"
          # The archive job may have saved meanwhile; it never touches this file.
          git push --quiet || { git pull --rebase --quiet && git push --quiet; }

      - name: Tell Healthchecks.io how the run went
        if: always()
        env:
          KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}  # set by Sumanth; nothing is sent until it exists
          OUTCOME: ${{ job.status == 'success' && '0' || '1' }}  # 0 = it worked, 1 = it failed
        run: |
          if [ -z "$KEY" ]; then
            echo "Not reported to Healthchecks.io: no key."
            exit 0
          fi
          KEY=$(printf %s "$KEY" | tr -d '[:space:]')  # a pasted key can carry a newline
          tail -n 1 archive/runs/registry-update.csv 2>/dev/null \
            | curl -fsS -m 10 --retry 3 --data-binary @- "https://hc-ping.com/$KEY/registry-update/$OUTCOME" \
            || echo "::warning::Healthchecks.io did not take this report. A 404 means the ping key is wrong or there is no check with the slug registry-update. It will report the run as late."
