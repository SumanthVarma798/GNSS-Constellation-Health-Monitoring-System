name: Tests

on:
  pull_request:
  # The weekly registry job starts this on its own branch: GitHub does not start jobs from a pull request its
  # built-in token opened, but does from this. The admin page merges only once these tests pass (issue 17).
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # matches runtime.txt
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
