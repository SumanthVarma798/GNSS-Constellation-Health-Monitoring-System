name: Tests

# Files no test reads: a change to only these does not start a run. docs/*.md is NOT listed (the assistant tests read
# it), and nothing under registry/ except its README, evidence/, data/, ui/, scripts/ or tests/ may ever be listed.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'registry/README.md'
      - 'CLAUDE.md'
      - '.lavish/**'
      - '.claude/**'
  # The weekly registry job starts this on its own branch: GitHub does not start jobs from a pull request its
  # built-in token opened, but does from this. The admin page merges only once these tests pass (issue 17).
  workflow_dispatch:
  # Pull requests are tested as they are pushed; main is tested once more only after a merge lands on it.
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'registry/README.md'
      - 'CLAUDE.md'
      - '.lavish/**'
      - '.claude/**'

permissions:
  contents: read

# A newer push to the same pull request stops the run it replaces, so superseded runs stop costing minutes.
# The group is per ref, so a pull request's run never cancels a run on main.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # matches runtime.txt
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
