# The dashboard (dashboard.py) at https://dashboard.opengnss.org and the administration console (admin.py) at
# https://console.opengnss.org, both on Render's free plan.
# Render reads this file when someone creates a Blueprint from this repository; see docs/infrastructure.md.
# Free plan: each sleeps after 15 minutes with no visitors and takes about a minute to wake.
services:
  - type: web
    name: opengnss-dashboard
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    buildFilter:
      # ponytail: skips only paths the dashboard never reads; switch to a daily deploy hook if free build minutes run short
      ignoredPaths:
        - "docs/**"
        - "tests/**"
        - "console/**"
        - "admin.py"
        - "cloudflare/**"
        - "**/*.md"
    domains:
      - dashboard.opengnss.org
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
  - type: web
    name: opengnss-console
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    # The console's settings live in Render as a secret file named secrets.toml, never in the repository; Streamlit
    # reads them from .streamlit/secrets.toml. Without the file the console starts but cannot sign anyone in.
    startCommand: >-
      if [ -f /etc/secrets/secrets.toml ]; then cp /etc/secrets/secrets.toml .streamlit/secrets.toml; fi &&
      streamlit run admin.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:   # the assistant reads docs/ and the code itself, so only tests and the Worker are skipped
        - "tests/**"
        - "cloudflare/**"
    domains:
      - console.opengnss.org
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
